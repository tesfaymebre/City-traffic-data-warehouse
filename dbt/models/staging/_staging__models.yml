version: 2

models:
  - name: stg_vehicle_tracks
    description: Cleaned vehicle-level records from raw pNEUMA extracts.
    columns:
      - name: track_id
        description: Vehicle identifier within a source file.
        tests:
          - not_null
      - name: vehicle_type
        description: Normalized vehicle class label.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ["Car", "Motorcycle", "Taxi", "Bus", "Medium Vehicle", "Heavy Vehicle"]
              config:
                tags: ["data_quality"]
      - name: traveled_distance
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 5000
              config:
                tags: ["data_quality"]
      - name: avg_speed
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 120
              config:
                tags: ["data_quality"]
      - name: source_file
        description: Originating CSV filename.
        tests:
          - not_null
      - name: capture_date
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - track_id
            - source_file

  - name: stg_trajectory_points
    description: Validated GPS samples with impossible coordinates filtered out.
    columns:
      - name: track_id
        tests:
          - not_null
      - name: source_file
        tests:
          - not_null
      - name: point_index
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 25000
              config:
                tags: ["data_quality"]
      - name: latitude
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 37.0
              max_value: 38.5
              config:
                tags: ["data_quality"]
      - name: longitude
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 23.0
              max_value: 24.5
              config:
                tags: ["data_quality"]
      - name: speed
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 150
              config:
                tags: ["data_quality"]
      - name: recorded_at
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 3600
              config:
                tags: ["data_quality"]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - track_id
            - source_file
            - point_index
