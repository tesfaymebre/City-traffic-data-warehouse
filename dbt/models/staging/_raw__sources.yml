version: 2

sources:
  - name: raw
    description: >
      Raw pNEUMA trajectory data loaded by the Airflow `load_pneuma_raw` DAG.
      One row per vehicle (tracks) and one row per GPS sample (points).
    schema: raw
    tables:
      - name: vehicle_tracks
        description: Vehicle-level metadata extracted from each pNEUMA CSV file.
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
        columns:
          - name: track_id
            description: Unique vehicle identifier within a source file.
          - name: vehicle_type
            description: Detected vehicle class (Car, Motorcycle, Bus, etc.).
          - name: traveled_distance
            description: Total distance traveled by the vehicle in meters.
          - name: avg_speed
            description: Average speed over the full trajectory in m/s.
          - name: source_file
            description: Originating pNEUMA CSV filename.
          - name: capture_date
            description: Observation date parsed from the source filename.
          - name: area_code
            description: Downtown area code from the source filename (e.g. d1).
          - name: loaded_at
            description: Timestamp when the row was loaded into the warehouse.
        tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              min_value: 1
              max_value: 10000000
              config:
                severity: error
                tags: ["data_quality", "raw"]

      - name: trajectory_points
        description: Time-series GPS samples for each vehicle track.
        columns:
          - name: track_id
            description: Foreign key to vehicle_tracks within the same source_file.
          - name: source_file
            description: Originating pNEUMA CSV filename.
          - name: point_index
            description: Zero-based sequence number along the trajectory.
          - name: latitude
            description: WGS84 latitude in degrees.
          - name: longitude
            description: WGS84 longitude in degrees.
          - name: speed
            description: Instantaneous speed in m/s at this sample.
          - name: recorded_at
            description: Elapsed seconds from the start of the trajectory.
        tests:
          - dbt_expectations.expect_table_row_count_to_be_between:
              min_value: 1
              max_value: 50000000
              config:
                severity: error
                tags: ["data_quality", "raw"]
